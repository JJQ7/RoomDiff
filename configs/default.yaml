# RoomDiff default configuration. Override with `--config other.yaml` and/or
# `--set section.key=value` on the command line.

# M1: video decoding and keyframe selection
ingest:
  num_keyframes: 48      # keyframes per video (one per equal-length time segment)
  max_side: 1024         # longer image side of saved keyframes in px (never upscaled)
  sharpness_window: 5    # candidates evaluated per segment
  min_motion: 0.02       # drop a keyframe whose motion to the previous one is below this
  jpeg_quality: 95
  mode: sharp            # sharp: sharpest frame per segment + motion filter (above);
                         # fixed: the frame closest to every k * fixed_interval_s, no filtering
  fixed_interval_s: 1.0  # fixed mode: seconds between keyframes (1.0 = SceneDiff GT frames)

# M2: joint Pi3X reconstruction of both keyframe sets (poses, depth, points)
recon:
  model: yyfz233/Pi3X    # Hugging Face model id (weights from the local HF cache)
  mode: joint            # joint: one pass over both recordings; separate: one pass each + Sim(3)
  pixel_limit: 255000    # max pixels per model input image (sides multiples of 14)
  max_frames: 96         # refuse bigger passes (VRAM / RAM safety); lower ingest.num_keyframes
  head_chunk: 16         # frames per chunk in Pi3X's point/conf heads (upstream 64; 16 cuts peak VRAM)
  conf_threshold: 0.25   # valid pixel: sigmoid(conf) above this ...
  edge_rtol: 0.03        # ... and not a depth/normal edge (relative depth jump)
  scale_factor: 1.0      # multiplies all metric outputs (e.g. from a tape-measure check)
  level_world: true      # rotate the result into a gravity-aligned frame: +Y up (camera up
                         # refined by a RANSAC floor plane), floor at y = 0, first before
                         # camera looking along +Z (unless the walls are snapped)
  snap_to_walls: false    # levelled frame: turn about +Y so that the dominant wall direction
                         # (histogram of the horizontal normals 0.3-2.0 m above the floor,
                         # folded modulo 90 deg) lies along +X / +Z ...
  wall_peak_fraction: 0.25  # ... if its peak (+-5 deg) holds at least this share of the votes
  n_anchor: 8            # separate mode: keyframes per recording in the anchor joint pass
  icp_refine: true       # separate mode: refine the Sim(3) with point-to-plane ICP
  voxel_size_diag: 0.02  # voxel size (m) for diagnostics, ICP and the .ply clouds

# M3: per-recording occupied / free / unknown voxel grids and change candidates
visibility:
  device: cuda           # torch device for point counting and ray carving (cpu if no GPU)
  voxel_size: auto       # metres, or auto = clip(2 x co-visible median NN distance, 0.02, 0.05)
  max_voxels: 12000000   # grid cap: the voxel size grows (and is logged) if the scene needs more
  bounds_percentile: 0.5 # grid box = [p, 100 - p] percentiles of all valid points per axis ...
  pad_voxels: 3          # ... padded by this many voxels
  n_occ_min: 3           # occupied: at least this many valid points in the voxel
  pixel_stride: 2        # free-space rays from every n-th valid pixel (rows and columns)
  carve_rel: 0.03        # rays carve up to depth * (1 - carve_rel) - carve_abs ...
  carve_abs: 0.04        # ... metres, in steps of voxel_size / 2
  n_free_min: 2          # free: seen empty by at least this many keyframes
  dist_margin: 0.04      # m, candidates must be farther than this from the other recording's surfaces
  opening_size: 2        # binary opening (cube edge, voxels) of disappeared / appeared; 1 = off.
                         # 3 (a 3x3x3 cube) erased every real change on the SceneDiff test scenes:
                         # surfaces are only 2-3 voxels thick
  min_blob_volume: 0.0015  # m^3, smaller candidate blobs are dropped ...
  min_blob_voxels: 8     # ... as are blobs with fewer voxels
  unverified_floor_cut: 0.06  # m: voxels less than this above the fitted floor plane (levelled
                         # frame, y = 0) are left out of the unverified candidates. Floor that only
                         # one video filmed is not an object, and objects standing on it were joined
                         # through it into room-sized regions (tabletop_1: 3.4-3.7 m strips named
                         # "wooden stool" after the objects on them). Only when recon levelled the
                         # frame on a floor plane; 0 = off; disappeared / appeared are untouched
  weak_alignment_demotes: false  # recon verdict "alignment WEAK" (the two reconstructions do not
                         # line up, so "seen empty" may be misalignment): every disappeared /
                         # appeared blob becomes unverified_before / unverified_after. Off: one
                         # pair per 20-pair subset is WEAK, and there the gate removed the false
                         # changes (reported FP 39 -> 33) but also the correct ones (TP 36 -> 35,
                         # development 25 -> 24), every AP lower; the verdict stays a diagnostic
                         # in the report (docs/design_note.md, section 2)
  debug_views: 2         # debug crops per blob and recording (best views of its voxels)
  occlusion_tol: 0.05    # m, depth tolerance of the debug-view scorer: a voxel centre is visible
                         # if the observed depth is within this of it (own recording) or no
                         # surface lies more than this in front of it (other recording)
  max_debug_blobs: 200   # debug crops for the largest blobs only

# Appearance channel (roomdiff/appearance.py): small or flat changes that the voxel
# differencing misses (closer than dist_margin to a surface), from the reprojected DINOv3
# feature dissimilarity and an asymmetric depth cue between co-visible keyframes of the two
# recordings; SAM 2.1 / DINOv3 / device / lift_voxel as configured under `instances`
appearance:
  enabled: true
  covis_stride: 8        # co-visibility: every n-th valid pixel (rows and columns) of a keyframe,
  covis_depth_rel: 0.03  # depth-consistent in the other keyframe if |z - depth| < max(covis_depth_abs,
  covis_depth_abs: 0.05  # covis_depth_rel z) (m); the same tolerance tells occluded patches apart
  min_covisibility: 0.3  # partners need this co-visibility (the smaller of both directions) ...
  pairs_per_frame: 2     # ... and every keyframe keeps this many best partners
  geom_tol_abs: 0.03     # depth cue: the partner sees more than geom_tol_abs + geom_tol_rel z (m)
  geom_tol_rel: 0.02     # beyond the patch's surface point, i.e. that surface is gone there
  w_feat: 1.0            # patch score = mean over observing partners of depth cue + w_feat (1 - cos)
  min_votes: 2           # patches observed by fewer partners score 0
  score_threshold: 0.60  # threshold of the bilinearly upsampled score map (0.45 at first: with
                         # the lighting change of living_room_1 unchanged surfaces score 0.4-0.5,
                         # so the hairbrush (0.76) merged into a bed-sheet region and flat false
                         # regions abounded; the wallet / hairbrush / tissue box score >= 0.7) ...
  threshold_mode: fixed  # ... or max_entropy: Kapur's threshold of all scores (always in meta.json)
  min_region_frac: 0.002 # connected regions smaller than this share of the image are dropped ...
  max_region_frac: 0.25  # ... as are larger ones
  max_regions_per_frame: 10  # at most this many regions per keyframe (highest mean score first)
  box_enlarge: 0.10      # SAM prompt = region box enlarged by this ...
  n_prompt_points: 5     # ... + up to this many highest-scoring patch centres inside the region
  min_mask_iou: 0.3      # the SAM mask must overlap the region by more than this IoU
  min_points: 30         # candidates / clusters with fewer lifted points (1 cm voxels) are dropped
  static_dist: 0.02      # m, a candidate driven by the depth cue with more than static_frac of its
  static_frac: 0.5       # points this close to the other recording's surfaces is static: dropped
  cluster_dist: 0.03     # m, candidates of one recording are clustered when more than cluster_frac
  cluster_frac: 0.3      # of the points of one lie this close to the other's
  min_frames: 2          # clusters need candidates in at least this many keyframes
  covered_dist: 0.03     # m, a cluster with more than covered_frac of its points this close to an
  covered_frac: 0.5      # M4 instance of its recording is already covered (not added)
  replace_overlap: 0.3   # an appearance instance of each recording whose boxes (grown by 2 cm)
                         # overlap more than this: a candidate `replaced` pair (removed + added)

# Detection channel (roomdiff/detection.py, `roomdiff detect`; part of `roomdiff run` only when
# enabled): Qwen3-VL lists the objects it sees (model / device from `semantics`), SAM 3 segments
# them in every keyframe (model / device from `recheck`), the masks are lifted to 3D and
# clustered into one object table per recording (lift_voxel / lift_cell_m / lift_link_m /
# mask_erode_px / DINOv3 from `instances`), and the two tables are associated; objects without
# a counterpart at their place that pass the gate below become candidates (instances `source:
# detection`). Their change confidence is scaled by the mean SAM 3 score of their views
# (changes.py, detection_support); they pair in place only with each other and never become
# moved changes (no M4 moved matching, no M5 re-pairing: look-alike items elsewhere)
detection:
  enabled: false
  vocab_frames: 4        # keyframes per recording shown to the VLM (spread over time, the
                         # sharpest of each time segment), one question each
  vocab_max_tokens: 400  # answer length of a vocabulary question
  max_prompts: 40        # phrases kept (most often named first) ...
  extra_prompts: []      # ... plus these (e.g. [chair, backpack]); parts of the place and generic
                         # words (object, item, furniture, person) are never prompts
  score_min: 0.5         # SAM 3 detections from this score (detection x presence) ...
  min_mask_px: 100       # ... with at least this many pixels at the recon resolution ...
  max_mask_frac: 0.5     # ... and at most this share of the image
  merge_iou: 0.7         # detections of different phrases in one keyframe overlapping more
                         # than this (mask IoU) are one detection voting for both phrases
  lift_erode_px: 2       # mask erosion before lifting (mixed-depth pixels on the outline)
  cluster_dist: 0.03     # m, detections of one recording are one object when more than
  cluster_frac: 0.3      # cluster_frac of the points of one lie this close to the other's and
                         # they share a phrase, or more than
  cluster_frac_any: 0.5  # cluster_frac_any of each one's points (a book on a table: most book
                         # points lie on the table, few table points on the book)
  min_views: 2           # objects need detections in this many keyframes ...
  min_points: 50         # ... this many points (1 cm voxels) ...
  max_extent: 2.0        # ... and no oriented-box side above this (m): walls, floors, whole
                         # counters are not objects
  feature_views: 4       # DINOv3 feature of an object: mask-pooled tokens of its best views
  same_place_dist: 0.05  # m, a before and an after object are at the same place if
  same_place_frac: 0.5   # this share of the smaller one's points lies within same_place_dist
                         # of the other's, or their box centres are closer than
  same_place_centre_min: 0.10  # max(same_place_centre_min,
  same_place_centre_rel: 0.25  #     same_place_centre_rel x the longest box side of the two)
  label_cos_min: 0.3     # compatible labels: equal top phrases or phrase-vote cosine >= this
  same_feature_min: 0.5  # same place + compatible labels + DINOv3 cosine >= this: unchanged;
                         # same place otherwise: candidate in-place replacement (both kept)
  min_observing_views: 3 # gate before the judge: a replaced / unmatched object is a candidate
                         # only if the other recording saw its place in this many keyframes
                         # (never seen: dropped, the channel makes no unverified regions) ...
  min_mean_score: 0.65   # ... its mean SAM 3 score is at least this ...
  max_label_count: 2     # ... and its top label names at most this many (not weak) objects of
                         # its recording (price tags, bottles on a shelf); dropped objects are
                         # listed with the reasons in detection/association.json `gate`
  see_through_override: 0.5  # M5: a removed / added detection change that the judge calls
                         # still / already there stays confirmed if at least this share of its
                         # visible points is seen through in the other recording
                         # (evidence.reason_class geometry_override); above 1: off
  covered_dist: 0.03     # m, a candidate with more than covered_frac of its points this close
  covered_frac: 0.5      # to a geometry / appearance instance of its recording is not added

# M4: object instances from the change blobs (SAM 2.1 masks lifted to 3D, DINOv3 features)
instances:
  device: cuda           # torch device for SAM 2.1 and DINOv3 (cpu if no GPU)
  sam_model: facebook/sam2.1-hiera-large
  dino_model: facebook/dinov3-vitl16-pretrain-lvd1689m
  min_unverified_volume: 0.004  # m^3, smaller unverified blobs are ignored ...
  max_unverified_extent: 1.5    # m, ... as are larger ones (longest box side): room regions
                                # that only one video filmed, not objects
  hidden_surface_margin: 0.20   # m, unverified blobs this close to a disappeared / appeared
                                # box are the surface that object hid or uncovered: dropped
  n_views: 4             # keyframes of the owner recording prompted per blob
  min_view_angle: 15.0   # deg, preferred minimum angle between the chosen viewing directions
  occlusion_tol: 0.05    # m, view scoring: a blob voxel is visible if the observed depth is
                         # within this of it; also the on-surface tolerance of the prompt points
  box_enlarge: 0.10      # SAM box prompt = box of the projected blob voxels enlarged by this
  n_prompt_points: 5     # positive prompt points (projected depth-visible blob voxels)
  mask_grow_rounds: 3    # a mask reaching a side of the prompt box is re-prompted with the box
                         # extended by its size on that side, at most this often (0 = off)
  lift_cell_m: 0.015     # m, lifting: all valid-depth mask pixels are lifted, binned into cells
  lift_link_m: 0.03      # m, ... of this size, linked when this close; the connected components
                         # holding the blob are kept ...
  near_voxel_m: 0.10     # ... minus points on static surfaces, unless this close to a blob voxel
  drop_static: true      # drop lifted points on surfaces the other recording also has
  max_growth: 6.0        # if the kept points' oriented box exceeds this x the blob's, the mask
                         # bled into the background: bounded lifting instead (lift_fallback) ...
  expand_m: 0.15         # ... = points in the blob box expanded by this and not static, or
                         # within near_voxel_m of a blob voxel
  lift_voxel: 0.01       # m, voxel size of the lifted instance points
  min_points: 150        # instances with fewer lifted points are dropped
  merge_mask_iou: 0.5    # merge fragments whose masks overlap more than this in a shared view ...
  merge_point_dist: 0.03 # ... or when more than merge_point_frac of the points of one lie
  merge_point_frac: 0.3  # ... within merge_point_dist m of the other
  merge_gap_m: 0.05      # then touching fragments of one kind (a chair seat and its base) are
  merge_gap_frac: 0.05   # joined: >= merge_gap_frac of the smaller one's points within
                         # merge_gap_m of the other's ...
  merge_max_extent_m: 1.5  # ... if every side of the union's oriented box stays below this
  mask_erode_px: 3       # mask erosion before pooling DINOv3 patch tokens
  cls_box_enlarge: 0.20  # CLS feature crop = mask box enlarged by this fraction
  frame_visible_frac: 0.20  # per-keyframe masks where >= this fraction of the points ...
  frame_depth_tol: 0.05     # ... is depth-consistent within this many metres ...
  frame_min_points: 200     # ... or at least this many of them (1 cm points: ~cm^2 seen), 0 = off.
                            # 200 adds objects partly out of the image: SceneDiff per-view AP
                            # +0.013 / +0.032, pixel IoU +0.010 / +0.019 (development / reported
                            # 20 pairs), the same objects matched; per-scene and typed AP equal on
                            # the development pairs, -0.001 / -0.002 on the reported ones (ranking
                            # noise), so adopted (docs/design_note.md, "Masks in more keyframes")
  frame_prompt_points: 8    # positive points of the per-keyframe SAM prompts

# M4: matching across recordings, change typing (added / removed / moved / unverified)
changes:
  lambda_size: 0.3       # cost = (1 - cos(feature)) + lambda_size * |log(volume ratio)|
  tau_feat: 0.65         # accept a match only if the feature cosine is at least this ...
                         # (0.55 matched a black jacket to a cream quilt at 0.60; true pairs
                         # on the SceneDiff test scenes scored 0.68-0.92; re-checked with the
                         # moved judge: 0.60 / 0.55 / 0.50 add no true pair on 40 val pairs)
  extent_ratio_min: 0.5  # ... and every sorted extent ratio lies in [min, max]
  extent_ratio_max: 2.0
  icp_max_dist: 0.10     # m, max correspondence distance of the moved-object ICP
  icp_min_fitness: 0.3   # rotation reported only if both point sets fit within 3 cm at least this
                         # well (else rotation_deg null) ...
  icp_reliable_fitness: 0.5  # ... and marked rotation_reliable from this fitness on (the ladder
                         # of living_room_1 scores 0.397-0.404 from run to run)
  free_views_full: 5     # observing views of the other recording that give full free-space evidence
  w_mask: 0.6            # confidence = (w_mask * SAM score + w_free * free-space evidence
  w_free: 0.4            #   + w_consistency * view consistency) / (sum of the weights);
  w_consistency: 0.0     #   unverified: half the mask/consistency part only (<= 0.5). View
                         #   consistency did not separate true from false SceneDiff detections,
                         #   the mask score did: 0.3 / 0.4 / 0.3 before (the old formula, with
                         #   appearance_evidence: frames)
  appearance_evidence: score  # appearance instances: confidence x (0.5 + 0.5 min(cue / full, 1)),
                         # cue = the cluster's mean region score (score, full =
                         # appearance_score_full) or its frames_supporting (frames, full =
                         # appearance_frames_full: the earlier factor)
  appearance_score_full: 2.0  # = 1 + appearance.w_feat, the largest region score
  appearance_frames_full: 4
  crop_min_px: 256       # crops are at least this many pixels per side (keyframe resolution) ...
  crop_context: 1.6      # ... and this many times the object box

# Spatial relations of the changes (roomdiff/relations.py; computed by `changes`, again by
# `describe` on its final change list, or alone by `roomdiff relations`): where each object
# sits ("on the floor", "on a surface 0.72 m above the floor", "under ...", "beside ...",
# moved "from ... to ..."), for the report and the viewer only (an added `relations` key;
# no type, confidence or mask changes). No model; levelled frames only (heights above y = 0)
relations:
  enabled: true
  cloud_stride: 2        # cloud of a recording = every n-th valid pixel (rows and columns)
  support_pad: 0.08      # m, support: cloud points in the ring around the object's footprint
                         # (its oriented box grown by this, minus the footprint) ...
  support_depth: 0.10    # m, ... from this far below the object's bottom (1st percentile of
  support_tol: 0.03      # its points' y) to this far above it ...
  own_dist: 0.02         # m, ... farther than this from the object's own instance points
  support_spread: 0.015  # m, horizontal patch: points within +- this of a height ...
  support_min_frac: 0.25 # ... in at least this share of the ring's 2 cm cells ...
  support_min_points: 30 # ... at least this many ...
  peak_frac: 0.5         # ... and at least this share of those cells' points within 3x the
                         # window (a level surface, not a slice of a wall); highest one wins
  floor_max: 0.05        # m, a support lower than this is the floor ...
  floor_min_inliers: 0.5 # ... if recon fitted a floor plane holding at least this share of the
                         # lowest 10 % of the points (recon/meta.json: floor_inliers_fraction);
                         # else y = 0 may be a counter that was the lowest surface filmed
                         # (kitchen_8: 0.09) and no height is quoted ("on a horizontal surface")
  cover_gap: 0.02        # m, cover ("under a surface"): the lowest such patch inside the
  cover_max: 1.2         # footprint from this to this far above the object's top ...
  cover_min_frac: 0.15   # ... over at least this share of the footprint cells
  on_tol: 0.05           # m, on(A, B): |bottom(A) - top(B)| below this and the footprints
  on_overlap: 0.3        # overlapping by more than this share of the smaller one (SuperMap's
                         # IoU misses a cup on a table); under(A, B): A's top at least on_tol
                         # below B's bottom, same overlap
  beside_gap: 0.15       # m, beside: footprints closer than this, height ranges overlapping
  same_height_tol: 0.05  # m, moved: before / after supports this close are "both times"

# M5: Qwen3-VL naming, paired-crop judge, re-pairing and descriptions (prompts are
# constants in roomdiff/semantics.py)
semantics:
  model: Qwen/Qwen3-VL-8B-Instruct  # Hugging Face model id (weights from the local HF cache)
  device: cuda           # bf16 on the GPU (16.3 GiB)
  quantize_4bit: false   # language model in bitsandbytes nf4 (Qwen3-VL-32B-Instruct: 19.5 GiB)
  max_new_tokens: 256    # per answer (greedy decoding); the one polishing call gets 90 per change
  image_max_side: 768    # px, every crop is resized to at most this on its longer side
  enable_judge: true     # paired-crop verdicts: rejected changes move to "rejected"
  describe_first: true   # removed / added / in-place judges say what each box contains before deciding
  enable_fragment_merge: true  # merge removed + removed / added + added parts of one object
  fragment_gap_m: 0.15   # m, ... whose oriented boxes are at most this far apart (VLM: one object)
  enable_repair: true    # merge split changes of one object (removed + added -> moved, ...)
  enable_polish: true    # one text-only call rewrites the template descriptions
  repair_max_distance: 3.0  # m, removed + added/unverified centroids closer than this are re-paired ...
  merge_max_distance: 1.0   # m, ... and a moved after-box absorbs an added box this close (box gap)
  repair_min_similarity: 0.85  # re-pair candidates: matching labels or, whatever the names (also the
                         # two sides of an in-place pair), a DINOv3 cosine of at least this between
                         # the best-matching instances of the two changes, sizes within the M4
                         # extent gate (above 1: labels only, the behaviour before 2026-10-14)
  unclear_factor: 0.7    # confidence multiplier of an "unclear" verdict
  split_factor: 0.6      # a moved pair the judge rejects becomes removed + added, each judged
                         # again (removed / added prompt): confidence x this if "unclear"

# Optional re-check after M5 (roomdiff/recheck.py, `roomdiff recheck`; part of `roomdiff run`
# only when enabled): SAM 3 looks for each change's label on the object in its own views and
# at its place in the other recording (evidence.recheck); it only rejects on strong evidence
recheck:
  enabled: false
  model: facebook/sam3   # official sam3.pt checkpoint of third_party/sam3 (SAM 3, not 3.1)
  device: cuda           # bf16 autocast on the GPU (3.3 GiB resident, about 5 GiB peak)
  max_views: 2           # keyframes per check: own side, and per place in the other recording
  score_min: 0.5         # a SAM 3 detection counts from this score (detection x presence) ...
  overlap_min: 0.3       # ... with at least this mask IoU with the stored object mask (own side)
                         # or with the projected place (other side) ...
  depth_tol: 0.15        # ... and, at a place, half of its pixels there within this many metres
                         # of the object's surface depth (not something behind or in front of it)
  reject_views: 2        # contradicting views needed to move a change to `rejected` (a moved
                         # change counts as contradicted only at both of its places); fewer
                         # contradicting views only lower the confidence:
  contradicted_factor: 0.6  # confidence x this when the label is found at the place
  unsupported_factor: 1.0   # confidence x this when it is not found on the object itself
                            # (1.0 = evidence only: SAM 3 misses many correct labels when the
                            # wording is unusual, so 0.9 lowered the benchmark AP)

# M6: Rerun recording and static web viewer assets
viz: {}

# SceneDiff benchmark evaluation (`roomdiff eval`, roomdiff/eval_scenediff.py)
eval:
  data_root: data/scenediff/scenediff_benchmark  # pair folders in data/, splits in splits/
  include_unverified: false  # also submit unverified regions (they claim no change; including them
                             # leaves the AP metrics unchanged and lowers the pixel IoU, 0.47 -> 0.37)
  mask_resolution: recon  # masks submitted at keyframe (full) or reconstruction (recon) resolution;
                          # measured identical to three decimals, recon is cheaper
  time_tol_s: 0.1        # sharp-mode keyframe -> benchmark frame round(t) if |t - round(t)| < this
  run_mem: 10G           # memory cap of each `roomdiff run` (scripts/run_guarded.sh -g -m)
  run_timeout_s: 1500    # timeout of each run in seconds (scripts/run_guarded.sh -t)
